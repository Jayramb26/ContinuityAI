# Render Blueprint for a public synthetic-data demo only.
services:
  - type: web
    name: continuityai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: https://continuityai-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: AUTH_SECRET
        generateValue: true
      - key: DEMO_EMAIL
        value: demo@continuityai.app
      - key: DEMO_PASSWORD
        value: ContinuityDemo2026!
  - type: web
    name: continuityai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://continuityai-api.onrender.com/api
